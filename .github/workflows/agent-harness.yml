name: Agent harness on Windows

on:
  push:
    branches: [main]
    paths: ['app/**', 'workbench/**', 'ui-kit/**', 'tools/**', '.github/workflows/agent-harness.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-windows:
    runs-on: windows-2022
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
        working-directory: app
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.3'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --include=optional
      - run: node ../tools/check-bundle.mjs
      - name: Desktop migration and PowerShell UTF-8 compatibility
        run: node --test ../tools/test-upgrade-workbench.mjs
      - name: Clear committed reports before recording this Windows run
        run: |
          $evidenceRoot = Join-Path (Split-Path $PWD.Path -Parent) 'docs/suite/evidence'
          @('agent-runtime-qwen/unit-final-win32.json', 'agent-runtime-qwen/system-placement.json', 'agent-runtime-qwen/offline-router.json', 'agent-runtime-ui/report.json', 'agent-runtime-ui/roles-composer-dark-1440.png', 'agent-runtime-ui/roles-settings-light-1000.png', 'role-transitions-ui/report.json', 'renderer-resilience-ui/report.json') | ForEach-Object {
            Remove-Item (Join-Path $evidenceRoot $_) -Force -ErrorAction SilentlyContinue
          }
      - run: npm test -- --reporter=json --outputFile=../docs/suite/evidence/agent-runtime-qwen/unit-final-win32.json
      - run: npm run build
      - name: Real Qwen system placement (local protocol provider, no external model)
        timeout-minutes: 3
        run: |
          $reportPath = Join-Path (Split-Path $PWD.Path -Parent) 'docs/suite/evidence/agent-runtime-qwen/system-placement.json'
          node tools/test-prompt-binding-live.mjs --capture-local-provider --report $reportPath
      - name: Real Qwen classifier isolation and negative controls
        timeout-minutes: 3
        run: node tools/test-qwen-router-offline.mjs
      - name: Actual desktop role and instruction UX
        timeout-minutes: 3
        run: node tools/test-roles-ui.mjs
      - name: Actual chat cancel, queue and resume
        timeout-minutes: 3
        run: node tools/test-chat-live.mjs
      - name: In-task role transitions through actual Qwen and desktop
        timeout-minutes: 4
        run: node tools/test-role-transitions-ui.mjs
      - name: Actual renderer crash, draft and runtime failure recovery
        timeout-minutes: 4
        run: node tools/test-renderer-resilience-ui.mjs
      - name: Host-managed Qwen native worker suppression without model requests
        timeout-minutes: 3
        run: node tools/test-managed-qwen-policy.mjs
      - name: Flash context, managed workers, vision bridge and queue desktop acceptance
        timeout-minutes: 5
        run: node tools/test-flash-runtime-ui.mjs
      - name: Retain exact Windows evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-harness-windows-${{ github.sha }}
          path: |
            docs/suite/evidence/agent-runtime-qwen/unit-final-win32.json
            docs/suite/evidence/agent-runtime-qwen/system-placement.json
            docs/suite/evidence/agent-runtime-qwen/offline-router.json
            docs/suite/evidence/agent-runtime-ui/report.json
            docs/suite/evidence/agent-runtime-ui/roles-composer-dark-1440.png
            docs/suite/evidence/agent-runtime-ui/roles-settings-light-1000.png
            docs/suite/evidence/agent-runtime-ui/roles-failure-win32.png
            docs/suite/evidence/role-transitions-ui/**
            docs/suite/evidence/renderer-resilience-ui/**
            docs/suite/evidence/flash-runtime-ui/**
          retention-days: 14
