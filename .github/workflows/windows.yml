name: Windows desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fail on source Data regressions before spending time on IDE installation and
  # Windows packaging. This job intentionally installs no IDE engine/toolchains.
  database-x64:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: app
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Pinned Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # Matches the independent IDE runtime pin; never floats to a new 22.x.
          node-version: '22.23.3'
          architecture: x64
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked app dependencies including native optional packages
        run: npm ci --include=optional

      - name: Typecheck and build source renderer/main/provider
        run: npm run build

      - name: Real PostgreSQL engine, stdio MCP and COPY source acceptance
        timeout-minutes: 5
        run: node tools/test-database-live.mjs

      - name: Actual source Electron Data workspace acceptance
        timeout-minutes: 5
        run: node tools/test-database-live.mjs --ui

      - name: Upload source database evidence and isolated failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-source-evidence-windows-${{ github.sha }}
          path: |
            docs/suite/evidence/database-runtime-live-win32.json
            docs/suite/evidence/database-runtime-ui-win32.json
            docs/suite/evidence/database-runtime-dark-win32.png
            docs/suite/evidence/database-runtime-light-win32.png
            docs/suite/evidence/database-runtime-relations-win32.png
            app/test-results/database
          if-no-files-found: warn
          retention-days: 14

  windows-x64:
    needs: database-x64
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: app
    env:
      CI: true
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Pinned Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22.23.3'
          architecture: x64
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install locked dependencies including native optional packages
        run: npm ci --include=optional

      - name: Restore verified IDE download archives
        id: ide-downloads
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ide/plugin-cache/*.vsix
            app/runtime/ide-node/*.zip
            app/runtime/ide-tools/cache/*
          key: ide-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ide/node-runtime-lock.json', 'ide/toolchains-lock.json', 'ide/plugins-lock.json') }}

      - name: Install pinned IDE engine, extensions and Java/Maven toolchain
        id: ide-setup
        timeout-minutes: 20
        run: npm run setup:ide

      - name: Python structured result pipe race and incomplete-result regression
        timeout-minutes: 2
        run: node --test ../ide/tools/test-python-result-drain.mjs

      - name: Save verified IDE downloads before acceptance tests
        if: steps.ide-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ide/plugin-cache/*.vsix
            app/runtime/ide-node/*.zip
            app/runtime/ide-tools/cache/*
          key: ${{ steps.ide-downloads.outputs.cache-primary-key }}

      - name: Verify Workbench script hashes, manifest and entry links
        run: node ../tools/check-bundle.mjs

      - name: Legacy Workbench suites on Windows PowerShell 5.1
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -File ../workbench/tests/run-tests.ps1 -RequireNode
          if ($LASTEXITCODE -ne 0) { throw 'Windows PowerShell legacy suites failed' }

      - name: Unit and protocol fixture tests (no model credentials)
        run: npm test

      - name: Verify Windows native dependencies
        timeout-minutes: 2
        run: |
          @'
          const assert = require('node:assert/strict');
          const {spawn, spawnSync} = require('node:child_process');
          assert.equal(process.platform, 'win32');
          assert.equal(process.arch, 'x64');
          // A separate watchdog remains responsive if a native call blocks the probe.
          const probe = String.raw`
            const assert = require('node:assert/strict');
            const report = (phase, fields = {}) => console.log(JSON.stringify({phase, ...fields}));
            assert.ok(require('sharp').versions.vips);
            const pty = require('@lydell/node-pty');
            report('native_loaded');
            let output = '', exited = false, cleaned = false;
            const child = pty.spawn(process.env.ComSpec, ['/d', '/c', 'echo WORKBENCH_PTY_OK'], {name:'xterm-color', cols:80, rows:24, cwd:process.cwd(), env:process.env});
            report('spawn_returned');
            const data = child.onData(chunk => { output = (output + chunk).slice(-65536); });
            const exit = child.onExit(({exitCode}) => {
              if (exited) return;
              exited = true;
              report('pty_exit', {exitCode, output});
              assert.equal(exitCode, 0);
              assert.match(output, /WORKBENCH_PTY_OK/);
              // beta.15 natural exit closes its output socket; explicit kill also
              // releases the ConPTY worker/native handles. Leave the callback first.
              setImmediate(() => {
                data.dispose(); exit.dispose();
                report('cleanup_requested');
                child.kill();
                cleaned = true;
                report('cleanup_returned');
              });
            });
            const diagnostic = setTimeout(() => report('still_alive', {exited, cleaned, resources:process.getActiveResourcesInfo()}), 10000);
            diagnostic.unref();
            process.once('beforeExit', () => {
              assert.ok(exited && cleaned, 'Probe ended without observing PTY exit and cleanup');
              clearTimeout(diagnostic);
              report('natural_exit_ready');
            });
          `;
          const child = spawn(process.execPath, ['-e', probe], {stdio:['ignore','pipe','pipe'], windowsHide:true, shell:false});
          let stdout = '', stderr = '', timedOut = false;
          child.stdout.on('data', chunk => { stdout = (stdout + chunk).slice(-131072); process.stdout.write(chunk); });
          child.stderr.on('data', chunk => { stderr = (stderr + chunk).slice(-131072); process.stderr.write(chunk); });
          const timer = setTimeout(() => {
            timedOut = true;
            console.error('Native PTY watchdog expired; probe is FAILED even if it emitted a success milestone.');
            const killed = spawnSync('taskkill.exe', ['/PID', String(child.pid), '/T', '/F'], {encoding:'utf8', timeout:5000, windowsHide:true, shell:false});
            console.error('Watchdog tree cleanup:', JSON.stringify({status:killed.status, error:killed.error?.message, stdout:killed.stdout, stderr:killed.stderr}));
            process.exitCode = 1;
            child.kill();
          }, 30000);
          child.on('error', error => { clearTimeout(timer); console.error(error); process.exitCode = 1; });
          child.on('close', (code, signal) => {
            clearTimeout(timer);
            try {
              assert.equal(timedOut, false, 'Native probe exceeded its watchdog');
              assert.equal(code, 0, 'Native probe failed: ' + stderr + ' signal=' + signal);
              const records = stdout.split(/\r?\n/).filter(line => line.startsWith('{')).map(line => JSON.parse(line));
              assert.ok(records.some(row => row.phase === 'pty_exit' && row.exitCode === 0 && /WORKBENCH_PTY_OK/.test(row.output)));
              assert.ok(records.some(row => row.phase === 'cleanup_returned'));
              assert.ok(records.some(row => row.phase === 'natural_exit_ready'));
              console.log('Windows PTY: actual output, exit code, explicit cleanup and natural Node exit verified. Sharp loaded.');
            } catch (error) { console.error(error); process.exitCode = 1; }
          });
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw 'Windows native dependency probe failed' }

      - name: Typecheck and build renderer/main/preload
        run: npm run build

      - name: Offline Electron modal and focus regression
        timeout-minutes: 2
        run: npm run test:ui

      - name: Full application model catalog, queue and cancellation workflow
        timeout-minutes: 2
        run: node tools/test-chat-live.mjs

      - name: Real IDE language, edit, refactor, task, debug and recovery checks
        timeout-minutes: 12
        run: npm run test:ide:languages

      - name: Stage the self-contained IDE runtime
        run: npm run prepare:ide-package

      - name: Build unpacked Windows application
        run: npm exec --offline -- electron-builder --win --dir --x64 --publish never

      - name: Packaged application database provider and desktop acceptance
        timeout-minutes: 5
        run: node tools/test-database-live.mjs --ui --packaged

      - name: Launch and verify actual packaged IDE languages and recovery
        timeout-minutes: 12
        run: node tools/test-ide-live.mjs --packaged --languages

      - name: Build NSIS and portable from verified application (never publish)
        run: npm exec --offline -- electron-builder --win nsis portable --x64 --prepackaged release/win-unpacked --publish never

      - name: Verify packaged CLI and self-hosting references, then calculate artifact hashes
        run: |
          @'
          const fs = require('node:fs'), path = require('node:path'), assert = require('node:assert/strict');
          const {spawnSync} = require('node:child_process');
          const application = path.resolve('release/win-unpacked/GigaCode Workbench.exe');
          const cli = path.resolve('release/win-unpacked/resources/app.asar.unpacked/node_modules/@qwen-code/qwen-code/cli.js');
          assert.ok(fs.existsSync(application) && fs.existsSync(cli), 'Packaged app or bundled Qwen entrypoint is missing');
          const resources = path.resolve('release/win-unpacked/resources');
          for (const relative of [
            'workbench/CORE.md',
            'docs/suite/README.md',
            'suite/implementation-plan.json',
            'design/suite-workspace-prototype.html',
            'ui-kit/package.json',
            'ui-kit/src/index.ts',
            'LICENSE',
            'NOTICE',
            'THIRD_PARTY_NOTICES.md',
            'ide/src-gen/backend/main.js',
            'ide/lib/frontend/index.html',
            'ide/plugins-lock.json',
            'ide-tools/bindings.json',
          ]) assert.ok(fs.statSync(path.join(resources, relative)).isFile(), `Packaged reference is missing: ${relative}`);
          assert.equal(fs.existsSync(path.join(resources, 'ui-kit/node_modules')), false, 'UI-kit dependencies must not be copied into reference resources');
          const result = spawnSync(application, [cli, '--version'], {env:{...process.env, ELECTRON_RUN_AS_NODE:'1'}, encoding:'utf8', timeout:30000, windowsHide:true, shell:false});
          assert.ifError(result.error);
          assert.equal(result.status, 0, result.stderr);
          assert.ok(result.stdout.includes(require('@qwen-code/qwen-code/package.json').version), 'Packaged CLI did not report the pinned version');
          console.log('Packaged Qwen:', result.stdout.trim());
          '@ | node
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Qwen or packaged reference probe failed' }
          $artifacts = @(Get-ChildItem -LiteralPath 'release' -File -Filter '*.exe')
          if ($artifacts.Count -lt 2) { throw 'Expected both NSIS and portable executables' }
          $hashes = $artifacts | ForEach-Object { '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          $hashes | Set-Content -Encoding utf8 'release/SHA256SUMS.txt'

      - name: Collect isolated IDE test diagnostics
        if: always()
        run: |
          @'
          const fs=require('node:fs'),os=require('node:os'),path=require('node:path');
          const output=path.resolve('test-results/ide');fs.mkdirSync(output,{recursive:true});
          for(const name of fs.readdirSync(os.tmpdir()).filter(name=>name.startsWith('workbench-ide-live-'))) {
            const root=path.join(os.tmpdir(),name);let sequence=0;
            function walk(dir){for(const entry of fs.readdirSync(dir,{withFileTypes:true})){const full=path.join(dir,entry.name);if(entry.isDirectory()&&(['userdata','ide','logs'].includes(entry.name)||dir.endsWith(path.sep+'ide')))walk(full);else if(entry.isFile()&&(/^(result|native-error|native-output|native-test-failure|timeout-.*)\.json$/.test(entry.name)||['backend.log','frontend.jsonl','host.jsonl'].includes(entry.name)))fs.copyFileSync(full,path.join(output,name+'-'+(++sequence)+'-'+entry.name));}}
            walk(root);
          }
          '@ | node

      - name: Upload isolated IDE diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ide-diagnostics-windows-${{ github.sha }}
          path: app/test-results/ide
          if-no-files-found: warn
          retention-days: 7

      - name: Upload unsigned Windows build artifacts
        # Only isolated test resources are used in these reports/screenshots.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gigacode-workbench-windows-x64-${{ github.sha }}
          path: |
            app/release/*.exe
            app/release/*.exe.blockmap
            app/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaged database acceptance reports and isolated diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-evidence-windows-${{ github.sha }}
          path: |
            docs/suite/evidence/database-runtime-*-win32-packaged.json
            docs/suite/evidence/database-runtime-*-win32-packaged.png
            app/test-results/database
          if-no-files-found: warn
          retention-days: 14
